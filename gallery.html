<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화투 도감</title>
    <style>
      body { margin: 0; padding: 8px; background: #fff; font-family: 'Malgun Gothic', sans-serif; }
      #grid { display: flex; flex-wrap: wrap; gap: 4px; }
      .c { width: var(--w, 180px); height: calc(var(--w, 180px) * 1.6); }
      .c svg, .c img { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module">
      import { cardSvg } from '/src/ui/cardArt.ts';
      // ?ids=0,1,2 또는 ?from=0&to=9 로 일부만 볼 수 있다
      const q = new URLSearchParams(location.search);
      const ids = q.get('ids')?.split(',').map(Number) ??
        Array.from({ length: Number(q.get('to') ?? 50) - Number(q.get('from') ?? 0) + 1 }, (_, i) => i + Number(q.get('from') ?? 0));
      if (q.get('w')) document.documentElement.style.setProperty('--w', q.get('w') + 'px');
      document.getElementById('grid').innerHTML = ids.map((i) => `<div class="c">${cardSvg(i)}</div>`).join('');
    </script>
  </body>
</html>
